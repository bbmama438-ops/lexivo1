<script>
var L=[
{lv:"A1",t:"Hello & To Be",en:"Use am / is / are. I am, you are, he/she/it is, we/you/they are. Add not to make a negative: I am not.",ar:"نستخدم am مع I، و is مع he/she/it، و are مع you/we/they. للنفي نضيف not.",
w:[["hello","مرحبا"],["name","اسم"],["student","طالب"],["from","من"],["happy","سعيد"]],
q:[["She ___ a student.",["am","is","are"],1],["I ___ from Morocco.",["am","is","are"],0],["They ___ happy.",["is","am","are"],2]]},
{lv:"A1",t:"Family & Have/Has",en:"Use have with I/you/we/they and has with he/she/it. I have a sister. He has a brother.",ar:"نستخدم have مع I/you/we/they و has مع he/she/it.",
w:[["mother","أم"],["father","أب"],["brother","أخ"],["sister","أخت"],["family","عائلة"]],
q:[["He ___ two sisters.",["have","has","is"],1],["We ___ a big family.",["has","have","are"],1],["I ___ a brother.",["has","have","am"],1]]},
{lv:"A1",t:"Daily Routine",en:"Present simple: use the base verb. For he/she/it add -s. I wake up at 7. She wakes up at 8.",ar:"المضارع البسيط: الفعل كما هو، ومع he/she/it نضيف s.",
w:[["wake up","يستيقظ"],["eat","يأكل"],["work","يعمل"],["sleep","ينام"],["every day","كل يوم"]],
q:[["She ___ at 8 every day.",["work","works","working"],1],["I ___ breakfast at home.",["eat","eats","eating"],0],["He ___ late.",["sleep","sleeps","sleeping"],1]]},
{lv:"A2",t:"Past Simple",en:"For finished actions, add -ed to regular verbs: I played. Some verbs are irregular: go → went, eat → ate. Questions use did + base verb.",ar:"الماضي البسيط: نضيف ed للأفعال المنتظمة. وبعض الأفعال شاذة مثل go → went. والسؤال بـ did + الفعل الأصلي.",
w:[["yesterday","أمس"],["went","ذهب"],["bought","اشترى"],["visited","زار"],["last week","الأسبوع الماضي"]],
q:[["Yesterday I ___ to school.",["go","went","going"],1],["Did you ___ the movie?",["watched","watch","watching"],1],["She ___ a new phone last week.",["buy","buys","bought"],2]]},
{lv:"A2",t:"Future: Will & Going to",en:"Use will for quick decisions and predictions: I will help you. Use going to for plans: I am going to travel next month.",ar:"will للقرارات السريعة والتوقعات، و going to للخطط المسبقة.",
w:[["tomorrow","غدا"],["plan","خطة"],["travel","يسافر"],["next month","الشهر القادم"],["maybe","ربما"]],
q:[["I ___ travel next month. (plan)",["will","am going to","went"],1],["The phone is ringing. I ___ answer it.",["will","am going to","answered"],0],["They ___ visit us tomorrow.",["is going to","are going to","goes to"],1]]},
{lv:"B1",t:"Present Perfect",en:"Use have/has + past participle for experience or recent results: I have visited Paris. She has finished her work. Use for / since for duration.",ar:"المضارع التام: have/has + التصريف الثالث للفعل. نستخدمه للتجارب والنتائج الحالية.",
w:[["already","بالفعل"],["never","أبدا"],["ever","في أي وقت"],["since","منذ"],["experience","تجربة"]],
q:[["I ___ never eaten sushi.",["has","have","am"],1],["She ___ lived here since 2020.",["has","have","is"],0],["Have you ___ to London?",["been","be","was"],0]]},
{lv:"A1",t:"Articles & Plurals",en:"Use a before consonant sounds and an before vowel sounds: a book, an apple. Add -s for plurals: book → books. Add -es after s, sh, ch, x: box → boxes.",ar:"نستخدم a قبل الحروف الساكنة و an قبل حروف العلة. للجمع نضيف s أو es.",
w:[["book","كتاب"],["apple","تفاحة"],["box","صندوق"],["bag","حقيبة"],["egg","بيضة"]],
q:[["I have ___ apple.",["a","an","the"],1],["Two ___ are on the table.",["box","boxes","boxs"],1],["She has ___ car.",["a","an","two"],0]]},
{lv:"A1",t:"Question Words",en:"What = thing, Where = place, Who = person, When = time, Why = reason. Put the question word first: Where do you live? What is your name?",ar:"What للأشياء، Where للمكان، Who للشخص، When للوقت، Why للسبب. نضع كلمة السؤال في البداية.",
w:[["what","ماذا"],["where","أين"],["who","من"],["when","متى"],["why","لماذا"]],
q:[["___ do you live? In Casablanca.",["Who","Where","When"],1],["___ is your teacher? Mr. Ali.",["Who","Where","Why"],0],["___ is your birthday? In May.",["What","When","Where"],1]]},
{lv:"A1",t:"Can & Can’t",en:"Use can + base verb for ability: I can swim. Negative: cannot or can’t. No -s with he/she: She can swim. Question: Can you help me?",ar:"can تعبر عن القدرة، ولا نضيف s مع he/she. النفي can’t والسؤال Can you...?",
w:[["swim","يسبح"],["cook","يطبخ"],["drive","يقود"],["speak","يتحدث"],["help","يساعد"]],
q:[["She ___ speak English.",["can","cans","can to"],0],["I ___ drive. I am too young.",["can","can’t","cans"],1],["___ you help me?",["Can","Are","Do"],0]]},
{lv:"A1",t:"There is / There are",en:"There is + one thing. There are + many things. Use this/these for near things and that/those for far things.",ar:"There is لشيء واحد، و There are لأشياء كثيرة. this/these للقريب و that/those للبعيد.",
w:[["near","قريب"],["far","بعيد"],["room","غرفة"],["table","طاولة"],["window","نافذة"]],
q:[["There ___ two chairs.",["is","are","am"],1],["___ is my book. (in my hand)",["This","That","These"],0],["There ___ a window.",["is","are","be"],0]]},
{lv:"A2",t:"Comparatives",en:"Short adjectives add -er: tall → taller. Long adjectives use more: more expensive. Use than: She is taller than me. Superlatives: the tallest, the most expensive.",ar:"الصفات القصيرة نضيف er، والطويلة نستخدم more. للتفضيل المطلق: the + est أو the most.",
w:[["bigger","أكبر"],["cheaper","أرخص"],["expensive","غالي"],["better","أفضل"],["worse","أسوأ"]],
q:[["My brother is ___ than me.",["tall","taller","tallest"],1],["This phone is ___ expensive than that one.",["more","most","much"],0],["She is the ___ student in class.",["smart","smarter","smartest"],2]]},
{lv:"A2",t:"Present Continuous",en:"Use am/is/are + verb-ing for actions happening now: I am studying. They are playing. Time words: now, right now, at the moment.",ar:"المضارع المستمر: am/is/are + الفعل مع ing للأفعال التي تحدث الآن.",
w:[["now","الآن"],["right now","في هذه اللحظة"],["listen","يستمع"],["watch","يشاهد"],["study","يدرس"]],
q:[["She is ___ now.",["reads","reading","read"],1],["They ___ playing football.",["is","are","am"],1],["I am ___ English.",["study","studies","studying"],2]]},
{lv:"A2",t:"Should & Must",en:"should = advice. must = strong necessity. mustn’t = it is forbidden. Use the base verb after them: You should rest. You must wear a seat belt.",ar:"should للنصيحة، must للضرورة، mustn’t للمنع. بعدها الفعل الأصلي.",
w:[["advice","نصيحة"],["rule","قاعدة"],["healthy","صحي"],["safe","آمن"],["careful","حذر"]],
q:[["You ___ drink more water. (advice)",["should","mustn’t","did"],0],["You ___ stop at a red light.",["should","must","can"],1],["You ___ use your phone here. It is forbidden.",["mustn’t","should","can"],0]]},
{lv:"A2",t:"Much, Many & A lot of",en:"many + countable things: many books. much + uncountable things: much water. We use much/many in questions and negatives. A lot of works for both.",ar:"many مع ما يعد، و much مع ما لا يعد. و a lot of تصلح للاثنين.",
w:[["water","ماء"],["money","مال"],["time","وقت"],["people","ناس"],["enough","كاف"]],
q:[["How ___ money do you have?",["many","much","few"],1],["There aren’t ___ chairs.",["much","many","a little"],1],["I have a ___ of friends.",["lot","much","many"],0]]},
{lv:"B1",t:"First Conditional",en:"If + present simple, will + base verb: If it rains, I will stay home. Use it for real, possible future situations. unless = if not.",ar:"الشرط الأول: If + مضارع بسيط، will + الفعل الأصلي. للمواقف الممكنة في المستقبل.",

var h='<div style="display:flex;justify-content:space-between;align-items:center"><h1>Admin</h1><span><button class="ghost" onclick="go(\'profile\')">Open app</button> <button class="ghost" onclick="aOut()">Log out</button></span></div>',m=/^L(\d+)$/.exec(AD);
if(AD==="home"){h+='<p class="mut">Change any lesson, podcast, text or option. Changes are saved on this device only.</p>';
[["lessons","Lessons","Edit, add or delete lessons, examples, words, quizzes and writing tasks"],["pods","Podcasts","Edit the podcast cards"],["opts","App options","Name, splash text, XP and exam days"],["data","Data","Copy, paste or reset everything"]].forEach(function(x){h+='<button class="card lesson" onclick="aGo(\''+x[0]+'\')"><span><b>'+x[1]+'</b><br><span class="badge">'+x[2]+'</span></span><b style="color:var(--ac)">&rsaquo;</b></button>'})}
else h+='<button class="ghost" onclick="aGo(\''+(m?'lessons':'home')+'\')">&larr; Back</button>';
if(AD==="lessons"){L.forEach(function(l,i){h+='<button class="card lesson" onclick="aGo(\'L'+i+'\')"><span><b>'+(i+1)+'. '+esc(l.t)+'</b> <span class="badge">'+l.lv+'</span><br><span class="badge">'+l.w.length+' words, '+l.q.length+' questions</span></span><b style="color:var(--ac)">Edit</b></button>'});h+='<button class="btn" onclick="aAdd()">+ Add a lesson</button>'}
else if(m&&L[+m[1]]){var i=+m[1],l=L[i];
h+='<div class="card"><label class="al">Title</label><input id="et" value="'+esc(l.t)+'"><label class="al">Level</label>'+aSel("elv",l.lv,[["A1","A1"],["A2","A2"],["B1","B1"]])+'<label class="al">Grammar explanation (English)</label><textarea id="een" rows="4">'+esc(l.en)+'</textarea><label class="al">Grammar note (Arabic)</label><textarea id="ear" rows="3" dir="rtl">'+esc(l.ar)+'</textarea>';
h+='<label class="al">Examples: one per line, English | Arabic</label><textarea class="mono" id="eex" rows="5">'+esc((EXS[i]||"").split(";").filter(Boolean).map(function(x){return x.replace("|"," | ")}).join("\n"))+'</textarea>';
h+='<label class="al">Words: one per line, word | Arabic</label><textarea class="mono" id="ewd" rows="8">'+esc(l.w.map(function(w){return w[0]+" | "+w[1]}).join("\n"))+'</textarea>';
h+='<label class="al">Questions: one per line, question | option ; option ; option | number of the right option</label><textarea class="mono" id="eq" rows="8">'+esc(l.q.map(function(q){return q[0]+" | "+q[1].join(" ; ")+" | "+(q[2]+1)}).join("\n"))+'</textarea>';
h+='<label class="al">Writing task (leave empty for none)</label><input id="ewp" value="'+esc(l.wr?l.wr.p:"")+'"><label class="al">Minimum words</label><input id="ewm" type="number" value="'+(l.wr?l.wr.m:10)+'">';
h+='<button class="btn" onclick="aSaveL('+i+')">Save lesson</button> <button class="ghost" style="color:var(--bad)" onclick="aDel('+i+')">'+(DEL===i?'Tap again to delete':'Delete lesson')+'</button><div class="ok2" id="aok"></div></div>'}
else if(AD==="pods"){h+='<div class="card"><label class="al">One podcast per line: title | level | YouTube search | word:Arabic, word:Arabic</label><textarea class="mono" id="epd" rows="12">'+esc(P.map(function(p){return p.t+" | "+p.lv+" | "+p.q+" | "+p.w.map(function(w){return w[0]+":"+w[1]}).join(", ")}).join("\n"))+'</textarea><button class="btn" onclick="aSaveP()">Save podcasts</button><div class="ok2" id="aok"></div></div>'}
else if(AD==="opts"){h+='<div class="card"><label class="al">App name</label><input id="ona" value="'+esc(CFG.name||"")+'" placeholder="Lexivo"><label class="al">Splash tagline</label><input id="otg" value="'+esc(CFG.tag||"")+'" placeholder="Learn English · A1 → B1"><label class="al">XP for each correct quiz answer</label><input id="oxp" type="number" value="'+(CFG.xpQ||10)+'"><label class="al">Weekend exam</label>'+aSel("oex",CFG.examAny?"1":"0",[["0","Only Saturday and Sunday"],["1","Open every day"]])+'<label class="al">Logo splash screen</label>'+aSel("osp",CFG.splash===false?"0":"1",[["1","Show"],["0","Hide"]])+'<button class="btn" style="margin-top:14px" onclick="aSaveO()">Save options</button><div class="ok2" id="aok"></div></div>'}
else if(AD==="data"){h+='<div class="card"><label class="al">All content (copy it to back up, or paste data here and tap Load)</label><textarea class="mono" id="edata" rows="9">'+esc(JSON.stringify({L:L,EXS:EXS,P:P,cfg:CFG}))+'</textarea><button class="btn" onclick="aImport()">Load pasted data</button><div class="ok2" id="aok"></div></div><div class="card"><button class="btn" style="background:var(--card2);color:var(--tx)" onclick="aResetC()">'+(DEL===-2?'Tap again to restore the original content':'Restore original lessons and options')+'</button><br><br><button class="btn" style="background:var(--card2);color:var(--tx)" onclick="aResetP()">'+(DEL===-3?'Tap again to clear all progress':'Clear learner progress on this device')+'</button></div>'}
app.innerHTML=h;window.scrollTo(0,0)}
try{var AO=JSON.parse(localStorage.getItem("lexivo_admin")||"null");if(AO){if(AO.L)L=AO.L;if(AO.EXS)EXS=AO.EXS;if(AO.P)P=AO.P;CFG=AO.cfg||{}}}catch(e){}
applyCfg();
auth();
var sp=document.getElementById("splash");
function hideSplash(){if(!sp||sp.dataset.h)return;sp.dataset.h=1;sp.classList.add("out");setTimeout(function(){sp.style.display="none"},800)}
if(sp){sp.onclick=hideSplash;setTimeout(hideSplash,3300)}
</script>

</body></html>
